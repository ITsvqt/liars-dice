<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liar's Dice</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/game/game.css">
</head>
<body>

    <!-- ── Setup screen ─────────────────────────────── -->
    <section id="setup-screen">
        <div class="setup-card">
            <h1>Game Setup</h1>
            <div class="field">
                <label for="player-name">Your Name</label>
                <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off" />
                <p class="hint" id="name-hint"></p>
                <p class="taken-names" id="taken-names"></p>
            </div>
            <div class="field">
                <label>Number of AI Players</label>
                <div class="stepper">
                    <button class="stepper-btn" id="ai-dec">−</button>
                    <span id="ai-count">2</span>
                    <button class="stepper-btn" id="ai-inc">+</button>
                </div>
            </div>
            <div class="field field--row">
                <label for="wild-ones">Wild Ones Mode</label>
                <input type="checkbox" id="wild-ones" />
            </div>
            <p class="hint error" id="setup-error"></p>
            <button class="btn" id="start-btn">Start Game</button>
        </div>
    </section>

    <!-- ── Game screen ──────────────────────────────── -->
    <section id="game-screen" hidden>

        <div class="game-wrap">

            <!-- Top row: labels above each column -->
            <div class="game-top">
                <div class="game-top-left">
                    <h2 id="round-label">Round 1</h2>
                </div>
                <div class="game-top-center"><!-- spacer --></div>
                <div class="game-top-right"><!-- spacer --></div>
            </div>

            <!-- Main row -->
            <div class="game-body">

                <!-- Left panel -->
                <aside class="players-panel">
                    <ul id="player-list"></ul>
                    <div class="panel-divider" id="wild-divider"></div>
                    <div class="wild-flag" id="wild-flag">
                        <span class="wild-flag-label">Wild Ones Mode</span>
                        <span class="wild-flag-badge off">OFF</span>
                    </div>
                    <div class="panel-divider"></div>
                    <div class="panel-stats">
                        <div class="dice-total">
                            <span class="dice-total-label">Dice on table</span>
                            <span class="dice-total-count" id="dice-total">—</span>
                        </div>
                        <div class="panel-divider panel-divider--v"></div>
                        <div class="current-bid-panel">
                            <span class="current-bid-label">Current bid</span>
                            <div class="current-bid-value">
                                <span id="panel-bid-qty">—</span>
                                <span class="bid-x" id="panel-bid-x">×</span>
                                <span id="panel-bid-die" class="panel-bid-die"></span>
                            </div>
                        </div>
                    </div>
                    <div class="panel-divider" id="hand-divider"></div>
                    <p class="hand-title" id="hand-title">Player Hand</p>
                    <div class="hand-cards" id="player-hand-cards"></div>
                </aside>

                <!-- Center: board + controls -->
                <div class="arena-col">
                    <div id="arena">
                        <div class="felt"></div>
                        <div class="felt-inner"></div>
                        <svg id="arc-svg" viewBox="0 0 572 572"></svg>
                        <div id="seats"></div>
                        <div class="center-info">
                            <p class="bid-value" id="current-bid">—</p>
                            <p class="bid-sub"   id="bid-sub">no bid yet</p>
                        </div>
                    </div>

                    <!-- Controls: Bid left, inputs below, Challenge right in red -->
                    <div id="controls" class="controls">
                        <div class="controls-inner">
                            <div class="controls-left">
                                <button class="btn btn--bid" id="bid-btn">Bid</button>
                                <div class="bid-inputs" id="bid-inputs">
                                    <div class="qty-group">
                                        <label for="bid-qty">Quantity</label>
                                        <div class="qty-stepper">
                                            <button type="button" class="qty-step" id="qty-dec">−</button>
                                            <input type="number" id="bid-qty" min="1" value="1" />
                                            <button type="button" class="qty-step" id="qty-inc">+</button>
                                        </div>
                                    </div>
                                    <div class="face-group">
                                        <label>Face</label>
                                        <div class="face-boxes" id="face-boxes">
                                            <button type="button" class="face-box" data-face="1">1</button>
                                            <button type="button" class="face-box" data-face="2">2</button>
                                            <button type="button" class="face-box" data-face="3">3</button>
                                            <button type="button" class="face-box" data-face="4">4</button>
                                            <button type="button" class="face-box" data-face="5">5</button>
                                            <button type="button" class="face-box" data-face="6">6</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button class="btn btn--challenge" id="challenge-btn" disabled>Challenge</button>
                        </div>
                        <p class="hint error" id="move-error"></p>
                    </div>
                </div>

                <!-- Right panel: log -->
                <aside class="log-col">
                    <p class="log-title">Log</p>
                    <div class="log-box">
                        <ul id="action-log"></ul>
                    </div>
                    <p id="turn-label" class="turn-label"></p>
                </aside>

            </div>
        </div>

        <!-- Game over overlay -->
        <div id="game-over" class="game-over-overlay" hidden>
            <div class="game-over-card">
                <h2 id="game-over-title">Game Over</h2>
                <p id="game-over-msg"></p>
                <button class="btn" id="restart-btn">Play Again</button>
                <a href="/quit" class="btn btn--ghost">Quit</a>
            </div>
        </div>

    </section>

    <!-- ── Reveal overlay ───────────────────────────── -->
    <div class="reveal-overlay" id="reveal-overlay">
        <div class="reveal-card">
            <h2 class="reveal-title" id="reveal-title">The Reveal</h2>
            <div class="player-hands" id="player-hands"></div>
            <hr class="reveal-divider">
            <div class="face-counts" id="face-counts"></div>
            <hr class="reveal-divider">
            <div class="result-banner" id="result-banner">
                <p class="result-verdict" id="result-verdict"></p>
                <p class="result-detail"  id="result-detail"></p>
            </div>
            <p class="loser-line" id="loser-line"></p>
            <button class="btn reveal-continue" id="reveal-continue">Continue →</button>
        </div>
    </div>

    <script src="/static/game/game.js"></script>
</body>
</html>
